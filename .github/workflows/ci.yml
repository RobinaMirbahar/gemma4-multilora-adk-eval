name: Python & Architecture Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Repository Integrity, Benchmark Datasets & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Full Pytest Verification Suite (Multi-LoRA ADK Eval + G-CCR + Trap-25 Sandbox)
        run: |
          pytest -v tests/
